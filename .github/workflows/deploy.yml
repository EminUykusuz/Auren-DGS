name: Deploy

# main'e her push: önce derleme/sözdizimi kontrolü, sonra API'nin VDS'te güncellenmesi.
# Her şey VDS'te: arayüz bulutta derlenip artifact olarak VDS'e iner, API aynı portta onu servis eder.
# Güvenlik: self-hosted runner kullanıldığı için tetikleyici yalnızca push'tur (pull_request yok → fork kodu VDS'te çalışmaz).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            
      - name: Arayüz derlemesi
        working-directory: client
        env:
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: npm ci && npm run build
        
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7
          if-no-files-found: error
          
      - name: Sunucu sözdizimi kontrolü
        working-directory: server
        run: |
          npm ci --ignore-scripts
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
          
      - name: Migration dosyaları boş mu?
        run: test -n "$(ls server/migrations/*.sql)"

  deploy-api:
    needs: check
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Güncelle (API + arayüz: kopyala, bağımlılık, migrate, yeniden başlat, sağlık kontrolü)"
        shell: powershell
        env:
          AUREN_APP_DIR: ${{ vars.AUREN_APP_DIR }}
          AUREN_PORT: ${{ vars.AUREN_PORT }}
        run: ./deploy/deploy.ps1